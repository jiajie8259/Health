<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>健檢趨勢觀察</title>
<style>
  :root {
    --bg: #f5f7f6; --card: #ffffff; --ink: #1d2a27; --sub: #5c6b67;
    --line: #dde4e1; --accent: #1f7a6a; --accent-ink: #ffffff;
    --ok: #17744f; --err: #b3261e; --code: #eef3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121816; --card: #1b2421; --ink: #e6efec; --sub: #9bb0aa;
      --line: #2c3a36; --accent: #4cb8a3; --accent-ink: #0b1512;
      --ok: #6fd3a5; --err: #ff8a80; --code: #24302c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: .02em; }
  .tag { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .card + .card { margin-top: 14px; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 10px 16px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; font-weight: 600; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .label { font-size: .8rem; color: var(--sub); margin: 14px 0 4px; }
  .uid-row { display: flex; gap: 8px; align-items: stretch; }
  code#uid {
    flex: 1; background: var(--code); border-radius: 8px; padding: 9px 10px;
    font-size: .85rem; word-break: break-all; user-select: all;
  }
  .msg { min-height: 1.4em; font-size: .9rem; margin: 8px 0 0; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .note { color: var(--sub); font-size: .85rem; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>健檢趨勢觀察</h1>
  <p class="tag">個人資料僅存於受登入保護的資料庫，本頁程式碼不含任何健檢資料。</p>

  <!-- 未登入 -->
  <section id="view-out" class="card">
    <button id="btn-login" class="primary">使用 Google 帳號登入</button>
    <p id="login-msg" class="msg" role="status"></p>
  </section>

  <!-- 已登入 -->
  <section id="view-in" hidden>
    <div class="card">
      <div id="uname" style="font-weight:600"></div>
      <div id="uemail" class="note" style="margin-top:0"></div>

      <div class="label">你的 UID（發布安全規則時要用）</div>
      <div class="uid-row">
        <code id="uid"></code>
        <button id="btn-copy" type="button">複製</button>
      </div>
      <p id="copy-msg" class="msg" role="status"></p>
    </div>

    <div class="card">
      <div style="font-weight:600">資料庫連線測試</div>
      <p class="note" style="margin-top:4px">只會暫時寫入再刪除一筆測試文件，不留任何資料。</p>
      <div class="row"><button id="btn-test" type="button">執行測試</button></div>
      <p id="test-msg" class="msg" role="status"></p>
    </div>

    <div class="row" style="margin-top:14px; justify-content:flex-end">
      <button id="btn-logout" type="button">登出</button>
    </div>
  </section>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
